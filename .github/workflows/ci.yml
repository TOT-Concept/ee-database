name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Vet + build + test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - run: go vet ./...
      - run: go test -race ./...
      - run: go build -trimpath -o /tmp/ee-database .
      - run: /tmp/ee-database version

  lint:
    name: golangci-lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      # v8 installs golangci-lint v2 — v1 is built with go1.24 and refuses a
      # go.mod targeting a newer Go. Exclusions live in .golangci.yml.
      - uses: golangci/golangci-lint-action@v8
        with:
          version: latest
          args: --timeout=5m
